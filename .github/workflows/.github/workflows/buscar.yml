name: Buscar vacantes

on:
  schedule:
    # Todos los días a las 7:17 a. m. hora de RD (11:17 UTC). GitHub puede atrasarlo unos minutos.
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: buscar-vacantes
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar y filtrar vacantes
        env:
          NTFY_LUZ: ${{ secrets.NTFY_LUZ }}
          NTFY_CRISTIAN: ${{ secrets.NTFY_CRISTIAN }}
        run: python buscador/buscar.py

      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Vacantes $(date -u +%Y-%m-%d)"
            git push
          fi
