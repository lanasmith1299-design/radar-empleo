<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Empleo</title>
<meta name="theme-color" content="#0E6656">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan: herramienta de trabajo diario. Tinta verde-petróleo sobre papel frío, ámbar solo para marcar lo urgente.
   Layout: barra superior con perfil + pestañas; cada vista es lista a la izquierda y detalle a la derecha (una columna en móvil). */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#15211F; --muted:#5A6965; --line:#D7DEDB;
  --accent:#0E6656; --accent-ink:#FFFFFF; --accent-soft:#DFEFEA; --mark:#C98A00; --mark-soft:#FBF1D8;
  --ok:#1C7548; --ok-soft:#E1F2E8; --warn:#9C5A00; --warn-soft:#FAEED6; --bad:#A92E27; --bad-soft:#F8E1DF;
  --paper:#FFFFFF; --paper-ink:#1B1B1B;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,33,31,.06), 0 4px 14px rgba(20,33,31,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#162120; --surface-2:#1B2826; --ink:#E6EEEB; --muted:#9AAEA8; --line:#2B3B38;
    --accent:#4FC2A7; --accent-ink:#06201A; --accent-soft:#1D3A33; --mark:#E7B13A; --mark-soft:#3A2F12;
    --ok:#5FCB91; --ok-soft:#173326; --warn:#E9A848; --warn-soft:#3A2A10; --bad:#F0857D; --bad-soft:#3D1B19;
    --paper:#FDFDFC; --paper-ink:#1B1B1B; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#162120; --surface-2:#1B2826; --ink:#E6EEEB; --muted:#9AAEA8; --line:#2B3B38;
  --accent:#4FC2A7; --accent-ink:#06201A; --accent-soft:#1D3A33; --mark:#E7B13A; --mark-soft:#3A2F12;
  --ok:#5FCB91; --ok-soft:#173326; --warn:#E9A848; --warn-soft:#3A2A10; --bad:#F0857D; --bad-soft:#3D1B19;
  --paper:#FDFDFC; --paper-ink:#1B1B1B; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; line-height:1.2}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.top{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.top-row{display:flex; align-items:center; gap:16px; padding:12px 20px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{font-size:21px; letter-spacing:-.01em}
.brand small{color:var(--muted); font-size:13px}
.who{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px}
.who button{border:0; background:transparent; padding:6px 16px; border-radius:999px; cursor:pointer; font-weight:700}
.who button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.tabs{display:flex; gap:4px; padding:0 14px; overflow-x:auto; scrollbar-width:thin}
.tabs button{border:0; background:none; padding:10px 12px 11px; cursor:pointer; color:var(--muted); font-weight:700; white-space:nowrap; border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}
main{padding:20px; max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.banner{margin:12px 20px 0; padding:10px 14px; border-radius:var(--radius); background:var(--mark-soft); color:var(--ink); border:1px solid var(--line); font-size:14px}
.banner.bad{background:var(--bad-soft)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.tile{padding:14px 16px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius)}
.tile[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.tile .lbl{color:var(--muted); font-size:13px}
.tile .num{font-family:var(--font-display); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}
.n-ok{color:var(--ok)} .n-warn{color:var(--warn)} .n-bad{color:var(--bad)} .n-acc{color:var(--accent)}
.split{display:grid; grid-template-columns:minmax(280px,400px) minmax(0,1fr); gap:16px; align-items:start}
.list{display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 260px); overflow:auto; padding-right:4px}
.item{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; cursor:pointer}
.item:hover{border-color:var(--muted)}
.item[aria-current="true"]{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:700; display:block}
.item .s{color:var(--muted); font-size:13.5px; display:block}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:12px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid transparent; white-space:nowrap}
.p-ok{background:var(--ok-soft); color:var(--ok)} .p-warn{background:var(--warn-soft); color:var(--warn)} .p-bad{background:var(--bad-soft); color:var(--bad)}
.p-acc{background:var(--accent-soft); color:var(--accent)} .p-mut{background:var(--surface-2); color:var(--muted); border-color:var(--line)}
.tag{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; font-size:14px; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); padding:5px 12px; border-radius:999px; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
label.f{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:700; color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:8px 10px; width:100%; color:var(--ink); font-weight:400; font-size:14.5px}
textarea{min-height:90px; resize:vertical; line-height:1.45}
textarea.code{font-family:var(--font-mono); font-size:13px; min-height:420px}
.check{display:flex; gap:8px; align-items:flex-start; font-size:14px; color:var(--ink); font-weight:400}
.check input{margin-top:3px}
.ficha{display:grid; grid-template-columns:200px minmax(0,1fr); border-top:1px solid var(--line); margin:0}
.ficha dt,.ficha dd{padding:9px 0; border-bottom:1px solid var(--line); margin:0}
.ficha dt{font-family:var(--font-mono); font-size:12px; color:var(--muted)}
.ficha dt span{display:inline-block; width:26px}
.ficha dd{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:13px}
.out{white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:14.5px; overflow-wrap:anywhere}
.out:empty{display:none}
.live{white-space:pre-wrap; color:var(--muted); font-size:14px}
.empty{padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius)}
.paper{background:var(--paper); color:var(--paper-ink); border:1px solid var(--line); border-radius:6px; padding:34px 40px; font-family:Calibri, "Carlito", "Segoe UI", Arial, sans-serif; font-size:13.5px; line-height:1.4; max-width:820px}
.paper .nm{font-size:24px; font-weight:700; margin-bottom:2px}
.paper .hd{color:#4a4a4a; font-size:12.5px}
.paper .h2{font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#1F3A36; border-bottom:1px solid #bbb; margin:16px 0 6px; padding-bottom:2px; font-size:13px}
.paper .h3{font-weight:700; margin-top:9px}
.paper .meta{font-style:italic; color:#555; font-size:12.5px}
.paper ul{margin:3px 0 4px; padding-left:20px}
.paper li{margin:2px 0}
.paper p{margin:3px 0}
.steps{display:grid; gap:14px}
.step h3{font-size:17px}
.step .num{font-family:var(--font-mono); color:var(--accent); font-size:12px; letter-spacing:.06em}
.board{display:grid; grid-template-columns:repeat(5,minmax(170px,1fr)); gap:10px; overflow-x:auto}
.col{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px; display:flex; flex-direction:column; gap:8px; min-height:120px}
.col h3{font-size:14px; display:flex; justify-content:space-between}
.chat{display:flex; flex-direction:column; gap:10px; max-height:58vh; overflow:auto; padding:4px}
.msg{padding:10px 13px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:92%}
.msg.u{background:var(--accent-soft); align-self:flex-end}
.msg.a{background:var(--surface-2); border:1px solid var(--line); align-self:flex-start}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs figure{margin:0; position:relative}
.thumbs img{width:96px; height:72px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block}
.thumbs button{position:absolute; top:-6px; right:-6px; border-radius:999px; width:22px; height:22px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:12px; line-height:1}
.note{border-left:3px solid var(--mark); background:var(--mark-soft); padding:9px 12px; border-radius:0 8px 8px 0; font-size:13.5px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
details summary{cursor:pointer; font-weight:700}
.modal-back{position:fixed; inset:0; background:rgba(10,16,15,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:20; overflow:auto}
.modal{width:min(760px,100%); background:var(--surface); border-radius:12px; border:1px solid var(--line); padding:20px; display:flex; flex-direction:column; gap:14px}
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; z-index:30; max-width:min(560px,92vw); font-size:14px; box-shadow:var(--shadow)}
.toast.bad{background:var(--bad); color:#fff}
@media (max-width: 980px){ .split{grid-template-columns:1fr} .list{max-height:none} .board{grid-template-columns:repeat(5,minmax(200px,1fr))} }
@media (max-width: 640px){ main{padding:14px} .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .ficha{grid-template-columns:1fr} .ficha dt{border-bottom:0; padding-bottom:0} .grid2{grid-template-columns:1fr} .paper{padding:20px} .top-row{padding:10px 14px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- Constantes ---------- */
const PERFILES=[{id:'luz',nombre:'Luz'},{id:'cristian',nombre:'Cristian'}];
const ESTADOS={verificada:'Verificada y abierta',pendiente:'Pendiente de verificar',excluida:'Excluida'};
const ESTADO_PILL={verificada:'p-ok',pendiente:'p-warn',excluida:'p-bad'};
const ETAPAS=[['por_revisar','Por revisar'],['preparando','Preparando postulación'],['postulada','Postulada'],['evaluacion','Evaluación'],['entrevista','Entrevista'],['oferta','Oferta'],['rechazada','Rechazada'],['descartada','Descartada']];
const ETAPA_LBL=Object.fromEntries(ETAPAS);
const EN_PROCESO=['postulada','evaluacion','entrevista','oferta'];
const TABS=[['vacantes','Vacantes'],['postular','Postular'],['cvs','Mis CVs'],['evaluaciones','Evaluaciones'],['reclutamiento','Reclutamiento'],['perfil','Ajustes']];
const CAMPOS=[['puesto','Puesto'],['empresa','Empresa'],['estado','Estado'],['url','Enlace original'],['fuente','Dónde se encontró'],['elegibilidad','Elegibilidad desde RD'],['modalidad','Modalidad'],['canal','Canal (voz / no-voz)'],['carga','Carga laboral'],['pago','Pago publicado'],['pagoHora','Equivalente por hora'],['contrato','Contrato y jornada'],['horarioRD','Horario (hora RD)'],['funciones','Funciones'],['requisitos','Requisitos'],['brechas','Lo que no cumples'],['encaje','Por qué encaja'],['linkedin','Postulantes en LinkedIn'],['fechas','Publicada / fecha límite'],['verificacion','Verificación']];
const DOCX_URL='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const HONESTIDAD='REGLA DE ORO: usa solo hechos que aparecen en el CV o en DATOS VERDADEROS. No inventes empresas, cargos, fechas, cifras, herramientas, certificaciones, títulos ni idiomas, ni exageres niveles. Puedes reordenar, resumir, cambiar el énfasis y usar las palabras de la vacante solo cuando describan algo que la persona realmente hizo. Si la vacante pide algo que no tiene, no lo agregues: anótalo como brecha.';
const PRACTICAS=[['Inglés tipo SHL o Versant','Hazme una práctica corta (8 preguntas) de inglés tipo SHL/Versant: gramática, vocabulario y comprensión de lectura, nivel profesional. Dame las preguntas numeradas y espera mis respuestas antes de corregir.'],['Redacción de correos de soporte','Dame 2 casos de clientes molestos por email (en inglés) para que yo escriba la respuesta. Luego corrige tono, gramática y resolución.'],['Data entry y atención al detalle','Hazme una práctica de data entry: 10 ejercicios para comparar registros y detectar errores (nombres, números, fechas, direcciones). Espera mis respuestas antes de corregir.'],['Juicio situacional','Hazme 5 preguntas de juicio situacional de atención al cliente y back-office con 4 opciones cada una. Espera mis respuestas y luego explica la mejor opción.'],['Excel básico','Hazme 6 preguntas prácticas de Excel básico para back-office (BUSCARV/XLOOKUP, filtros, tablas, formatos, fórmulas simples). Espera mis respuestas.'],['Pruebas de personalidad','Explícame cómo funcionan Predictive Index y DISC, qué miden y cómo responderlas con sinceridad y coherencia. Son pruebas sin respuestas correctas.']];
const HORAS='Hora de República Dominicana = UTC-4 todo el año (sin horario de verano). Este de EE. UU. (ET) es UTC-5 del 1 nov 2026 al 14 mar 2027 y UTC-4 el resto; Pacífico (PT) es UTC-8 en ese periodo y UTC-7 el resto.';

/* ---------- Estado ---------- */
function ls(k,v){try{ if(v===undefined) return localStorage.getItem('radar.'+k); localStorage.setItem('radar.'+k,v); }catch(e){ return null; }}
const S={
  pid: ls('pid')||'luz', tab: (location.hash||'').slice(1)||ls('tab')||'vacantes',
  db:null, sample:null, downloads:null, mcp:null, user:null, limits:null,
  ready:false, noRuntime:false, noDb:false, canWrite:true, sampleOff:false,
  profile:null, jobs:[], cvs:[], runs:[], loaded:{}, dbSlow:false, dbError:null,
  d:{}, busy:{}, out:{}, filtro:'pendiente', q:'', selJob:null, selCv:null, cvPreview:true,
  post:{jobId:null, cvId:null}, paquetes:{}, rec:{jobId:null, tipo:'entrevista'}, gmail:{},
  ev:{turns:[], files:[]}, modal:null, add:{}, toast:null, data:null, dataError:null, copiar:null
};
if(!TABS.some(t=>t[0]===S.tab)) S.tab='vacantes';
if(!PERFILES.some(p=>p.id===S.pid)) S.pid='luz';

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ try{ const x=new URL(String(u||'').trim()); return (x.protocol==='https:'||x.protocol==='http:')?x.href:''; }catch(e){ return ''; } }
function hoy(){ return new Date().toLocaleDateString('es-DO',{timeZone:'America/Santo_Domingo',weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function hoyCorto(){ return new Date().toLocaleDateString('es-DO',{timeZone:'America/Santo_Domingo',day:'numeric',month:'short',year:'numeric'}); }
function fmtFecha(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return String(iso); return d.toLocaleDateString('es-DO',{timeZone:'America/Santo_Domingo',day:'numeric',month:'short'}); }
function slug(s){ return (String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70))||('v-'+Date.now().toString(36)); }
function nowISO(){ return new Date().toISOString(); }
function P(){ return S.profile||{}; }
function nombreP(){ return P().nombre || (PERFILES.find(p=>p.id===S.pid)||{}).nombre || ''; }
function job(id){ return S.jobs.find(j=>j.id===id); }
function cv(id){ return S.cvs.find(c=>c.id===id); }
function dv(k,def){ return Object.prototype.hasOwnProperty.call(S.d,k)? S.d[k] : (def==null?'':def); }
function toast(msg,kind){ S.toast={msg,kind}; renderToast(); clearTimeout(toast.t); toast.t=setTimeout(()=>{ S.toast=null; renderToast(); }, kind==='bad'?7000:3500); }
function renderToast(){ let el=$('#toast'); if(!S.toast){ if(el) el.remove(); return; } if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.className='toast'+(S.toast.kind==='bad'?' bad':''); el.textContent=S.toast.msg; }
function splitBold(s){ const out=[]; String(s||'').split(/(\*\*[^*]+\*\*)/).forEach(p=>{ if(!p) return; if(/^\*\*[^*]+\*\*$/.test(p)) out.push({t:p.slice(2,-2),b:true}); else out.push({t:p,b:false}); }); return out; }
function inl(s){ return splitBold(s).map(r=>r.b?'<strong>'+esc(r.t)+'</strong>':esc(r.t)).join(''); }
const loadedScripts={};
function loadScript(src,ready){ if(ready()) return Promise.resolve(); if(loadedScripts[src]) return loadedScripts[src]; loadedScripts[src]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>{ delete loadedScripts[src]; rej(new Error('load')); }; document.head.appendChild(s); }); return loadedScripts[src]; }
async function copiar(text){ try{ await navigator.clipboard.writeText(text); toast('Copiado.'); }catch(e){ toast('No se pudo copiar automáticamente. Abre «Ver las instrucciones», selecciona el texto y cópialo a mano.','bad'); } }

/* ---------- Estructura de CV (marcas simples) ---------- */
function estructura(md){
  const out=[]; let sec=null, afterH3=false, beforeH2=true;
  String(md||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.replace(/\s+$/,''); if(!l.trim()) return;
    if(/^# /.test(l)){ out.push({t:'name',s:l.slice(2).trim()}); return; }
    if(/^## /.test(l)){ beforeH2=false; afterH3=false; out.push({t:'h2',s:l.slice(3).trim()}); return; }
    if(/^### /.test(l)){ afterH3=true; out.push({t:'h3',s:l.slice(4).trim()}); return; }
    if(/^\s*[-•*] /.test(l)){ afterH3=false; out.push({t:'li',s:l.replace(/^\s*[-•*] /,'').trim()}); return; }
    if(beforeH2){ out.push({t:'hdr',s:l.trim()}); return; }
    if(afterH3){ afterH3=false; out.push({t:'meta',s:l.trim()}); return; }
    out.push({t:'p',s:l.trim()});
  });
  return out;
}
function cvHTML(md){
  const b=estructura(md); let h='', inList=false;
  const close=()=>{ if(inList){ h+='</ul>'; inList=false; } };
  b.forEach(x=>{
    if(x.t==='li'){ if(!inList){ h+='<ul>'; inList=true; } h+='<li>'+inl(x.s)+'</li>'; return; }
    close();
    if(x.t==='name') h+='<div class="nm">'+inl(x.s)+'</div>';
    else if(x.t==='hdr') h+='<div class="hd">'+inl(x.s)+'</div>';
    else if(x.t==='h2') h+='<div class="h2">'+inl(x.s)+'</div>';
    else if(x.t==='h3') h+='<div class="h3">'+inl(x.s)+'</div>';
    else if(x.t==='meta') h+='<div class="meta">'+inl(x.s)+'</div>';
    else h+='<p>'+inl(x.s)+'</p>';
  });
  close(); return h||'<p class="muted">Este CV está vacío.</p>';
}

function partes(text,nombres){ const r={}; const re=new RegExp('^===\\s*('+nombres.join('|')+')\\s*===\\s*$','gmi'); let m, last=null, idx=0; const t=String(text||''); const cortes=[]; while((m=re.exec(t))){ cortes.push({n:m[1].toUpperCase(),i:m.index,f:re.lastIndex}); } cortes.forEach((c,k)=>{ r[c.n]=t.slice(c.f,k+1<cortes.length?cortes[k+1].i:t.length).trim(); }); if(!cortes.length) r[nombres[0].toUpperCase()]=t.trim(); return r; }

let pendiente=false, puntero=false;
function pedirRender(){ if(pendiente) return; pendiente=true; requestAnimationFrame(()=>{ pendiente=false; const a=document.activeElement; if(puntero||(a&&a.tagName==='SELECT')){ S.renderLuego=true; return; } render(); }); }
function render(){
  const app=$('#app'); const a=document.activeElement; let foco=null;
  if(a&&a.id&&app.contains(a)) foco={id:a.id,s:a.selectionStart,e:a.selectionEnd,top:a.scrollTop};
  const scrolls={}; app.querySelectorAll('[data-keep]').forEach(el=>{ scrolls[el.dataset.keep]=el.scrollTop; });
  const wy=window.scrollY;
  app.innerHTML=vShell();
  app.querySelectorAll('[data-keep]').forEach(el=>{ if(scrolls[el.dataset.keep]!=null) el.scrollTop=scrolls[el.dataset.keep]; });
  if(foco){ const el=document.getElementById(foco.id); if(el){ el.focus({preventScroll:true}); try{ if(foco.s!=null) el.setSelectionRange(foco.s,foco.e); }catch(e){} el.scrollTop=foco.top; } }
  window.scrollTo(0,wy);
  Object.keys(S.busy).forEach(k=>{ const el=document.querySelector('[data-live="'+k+'"]'); if(el&&S.busy[k].text) el.textContent=S.busy[k].text; });
  const ch=$('#chatbox'); if(ch&&S.ev.scroll){ ch.scrollTop=ch.scrollHeight; S.ev.scroll=false; }
}

function pillClase(j){ if(j.estado==='pendiente'&&j.auto==='cumple') return 'p-acc'; return ESTADO_PILL[j.estado]||'p-mut'; }
function filtrarJobs(){
  const q=S.q.trim().toLowerCase(); let J=S.jobs.slice();
  if(S.filtro==='proceso') J=J.filter(j=>EN_PROCESO.includes(j.etapa)); else if(S.filtro!=='todas') J=J.filter(j=>j.estado===S.filtro);
  if(q) J=J.filter(j=>[j.puesto,j.empresa,j.fuente,j.funciones,j.notas].join(' ').toLowerCase().includes(q));
  return J.sort((a,b)=>(a.prioridad||9)-(b.prioridad||9)||String(b.actualizada||'').localeCompare(String(a.actualizada||'')));
}

function valorCampo(j,k){
  if(k==='estado') return (ESTADOS[j.estado]||'Sin estado')+(j.motivoEstado?' — '+j.motivoEstado:'');
  if(k==='canal') return (j.canal||'')+(j.canalDetalle?' — '+j.canalDetalle:'');

  if(k==='fechas') return [j.publicada&&('Publicada: '+j.publicada), j.fechaLimite&&('Fecha límite: '+j.fechaLimite)].filter(Boolean).join(' · ');
  return j[k]==null?'':String(j[k]);
}

  const j=job(S.rec.jobId);

    '<div class="card pad stack" style="box-shadow:none; background:var(--surface-2)"><div class="chips">'+tipos.map(x=>'<button class="chip" type="button" data-act="recTipo" data-id="'+x[0]+'" aria-pressed="'+(t===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+

function agregarImgs(files){ const lim=(imagenesOk()?{maxCount:4,maxInputBytes:20000000,mediaTypes:['image/png','image/jpeg','image/webp']}:null); if(!lim){ toast('Para enviar capturas a la app usa la IA local o Gemini (Ajustes). Con copiar y pegar, adjunta la captura directamente en ChatGPT o Gemini.','bad'); return; } files.filter(f=>/^image\//.test(f.type)).forEach(f=>{ if(S.ev.files.length>=lim.maxCount){ return; } if(f.size>lim.maxInputBytes){ toast('Esa imagen es demasiado grande.','bad'); return; } S.ev.files.push({file:f,url:URL.createObjectURL(f)}); }); render(); }

  const hist=turns.slice(-12).map(t=>({role:t.role,content:t.content}));
  const input=[{role:'user',content:intro}].concat(hist);
  render();
  const r=await preguntar('ev',input,{images:files});
  if(r){ turns.push({role:'assistant',content:r.trim()}); previas.forEach(f=>URL.revokeObjectURL(f.url)); }
  else { turns.pop(); S.ev.files=previas.concat(S.ev.files); if(borrador!=null) S.d['ev:in']=borrador; }
  S.ev.scroll=true; render();
}
document.addEventListener('paste',e=>{ if(S.tab!=='evaluaciones') return; const files=Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(f=>/^image\//.test(f.type)); if(files.length){ e.preventDefault(); agregarImgs(files); } });

/* ---------- Prompts ---------- */
function promptAnalisis(texto,url,fuente,li){
  return 'Analiza esta vacante para '+nombreP()+' según sus reglas. Hoy es '+hoy()+'.\n\n'+ctxPerfil()+'\n\nCV BASE (para medir encaje):\n'+cvPrincipal().slice(0,6000)+'\n\nVACANTE (enlace: '+(url||'no indicado')+'; dónde se encontró: '+(fuente||'no indicado')+'; postulantes en LinkedIn: '+(li||'no indicado')+'):\n'+String(texto).slice(0,18000)+'\n\n'+HORAS+'\n\nDevuelve SOLO un objeto JSON con estas claves (valores en español y breves; si un dato no aparece en el anuncio escribe "No indicado"; no inventes):\n{"puesto":"","empresa":"","elegibilidad":"si acepta candidatos en República Dominicana y en qué te basas","modalidad":"","canal":"no-voz | voz | mixto | desconocido","canalDetalle":"qué canales menciona","carga":"BAJA | MODERADA | ALTA | DESCONOCIDA","pago":"pago publicado tal cual, más el supuesto de conversión si lo hay","pagoHora":null,"contrato":"","horarioRD":"horario convertido a hora de RD","funciones":"","requisitos":"","brechas":"requisitos que la persona no cumple según su CV","encaje":"por qué encaja, citando experiencia real","publicada":"","fechaLimite":"","prioridad":3,"recomendacion":"pendiente | excluida","motivoEstado":"una línea","reglas":[{"regla":"nombre corto de la regla","resultado":"cumple | no cumple | no se sabe","detalle":"en qué te basas"}]}\n\nEn "reglas" revisa una por una sus reglas (máximo 8; incluye siempre canal, país, pago y tipo de puesto).\nCriterios: "excluida" si incumple una regla dura (incluye llamadas o voz; no acepta República Dominicana; pago claramente por debajo del mínimo; pide pagar algo; exige experiencia obligatoria que no tiene; empresa excluida en sus reglas; LinkedIn con 10 o más postulantes). En otro caso "pendiente". Nunca uses "verificada": eso lo marca la persona al abrir el formulario original. pagoHora: número solo si el pago publicado lo permite (anual ÷ 2080; mensual ÷ 173.3); si no, null. prioridad: 1 = encaja muy bien y cumple todo; 4 = encaje débil. carga: BAJA = tareas simples y repetitivas con poca presión; ALTA = metas agresivas, ritmo alto, muchas responsabilidades; DESCONOCIDA si el anuncio no da para saberlo.';
}
function promptAnalisisDoble(texto,url,fuente,li,perfiles){
  const bloques=perfiles.map(d=>{ const p=d.profile||{}; const nm=(PERFILES.find(x=>x.id===d.id)||{}).nombre; return '=== PERFIL "'+d.id+'" ('+(p.nombre||nm)+') ===\nREGLAS:\n'+(p.reglas||'(sin reglas)')+'\n'+lineaPago(p)+'\nDATOS VERDADEROS FUERA DEL CV:\n'+(p.hechos||'(ninguno)')+'\nCV:\n'+String(d.cv||'(sin CV cargado)').slice(0,5000); }).join('\n\n');

sponsabilidades; DESCONOCIDA si el anuncio no da para saberlo.';
}
function armarJob(r,x){
  x=x||{}; const pick=k=>r[k]==null?'':String(r[k]).slice(0,4000);
  const est=r.estado||'pendiente';
  const filtro=Array.isArray(r.reglas)?r.reglas.slice(0,10).map(f=>({regla:String(f&&f.regla||'').slice(0,120),resultado:String(f&&f.resultado||'').slice(0,20),detalle:String(f&&f.detalle||'').slice(0,300)})):[];
  return {filtro,puesto:pick('puesto')||'Vacante sin título',empresa:pick('empresa'),estado:est,motivoEstado:pick('motivoEstado'),url:x.url||'',fuente:x.fuente||'',elegibilidad:pick('elegibilidad'),modalidad:pick('modalidad'),canal:pick('canal'),canalDetalle:pick('canalDetalle'),carga:pick('carga'),pago:pick('pago'),pagoHora:typeof r.pagoHora==='number'?Math.round(r.pagoHora*10)/10:null,contrato:pick('contrato'),horarioRD:pick('horarioRD'),funciones:pick('funciones'),requisitos:pick('requisitos'),brechas:pick('brechas'),encaje:pick('encaje'),linkedin:x.li||pick('linkedin'),publicada:pick('publicada'),fechaLimite:pick('fechaLimite'),prioridad:Math.min(4,Math.max(1,parseInt(r.prioridad,10)||3)),descripcion:String(x.texto||'').slice(0,30000),verificacion:est==='verificada'?'Formulario original abierto, revisado a mano el '+hoyCorto():'Sin verificar ('+hoyCorto()+')'};
}
function extrasAdd(){ return {url:String(dv('add:url')).trim(),fuente:String(dv('add:fuente')).trim(),li:String(dv('add:li')).trim(),texto:String(dv('add:texto'))}; }
function promptAdaptar(j,c){
  return 'Adapta el CV BASE de '+nombreP()+' a esta VACANTE para pasar filtros ATS y convencer a un reclutador.\n\n'+HONESTIDAD+'\n\n'+ctxPerfil()+'\n\nVACANTE:\n'+txtVacante(j)+'\n\nCV BASE:\n'+c.contenido+'\n\nINSTRUCCIONES:\n- Escribe el CV en el idioma de la vacante (en inglés si el anuncio está en inglés).\n- Usa exactamente este formato de marcas: "# Nombre"; una línea de titular; una línea de contacto; "## SECCIÓN"; "### Cargo — Empresa"; una línea con fechas y lugar; viñetas con "- "; **negritas** solo en etiquetas de habilidades.\n- Titular y resumen orientados a este puesto; habilidades ordenadas por relevancia; en cada empleo, primero las viñetas que más se relacionan con la vacante. Conserva todos los empleos, fechas y la educación.\n- Máximo 2 páginas. Sin tablas, columnas ni emojis.\n\nResponde exactamente con estas 4 partes y nada más:\n===CV===\n(el CV adaptado)\n===CAMBIOS===\n(3 a 6 viñetas en español: qué cambiaste y por qué)\n===PALABRAS CLAVE===\nCubiertas: …\nFaltan (no se agregaron porque no son ciertas): …\n===BRECHAS===\n(viñetas en español: requisitos que no cumple y cómo responder con honestidad si se los preguntan)';
}
function promptVariante(c,enfoque){
  return 'Crea una versión del CV de '+nombreP()+' enfocada en: '+enfoque+'.\n\n'+HONESTIDAD+'\n\n'+ctxPerfil()+'\n\nCV BASE:\n'+c.contenido+'\n\nINSTRUCCIONES: mismo idioma del CV base; mismo formato de marcas ("# Nombre", titular, contacto, "## SECCIÓN", "### Cargo — Empresa", línea de fechas, viñetas "- ", **negritas** solo en etiquetas). Titular, resumen y habilidades orientados al enfoque; en cada empleo primero las viñetas relacionadas. Conserva todos los empleos, fechas y la educación. Máximo 2 páginas.\n\nResponde exactamente con:\n===CV===\n(el CV)\n===CAMBIOS===\n(3 a 5 viñetas en español)';
}
function promptImportar(t){
  return 'Convierte este CV pegado al formato de marcas de la app, sin agregar, quitar ni cambiar hechos (solo corrige errores de ortografía evidentes y ordena).\nFormato: "# Nombre completo"; una línea de titular; una línea de contacto (ciudad | teléfono | email | LinkedIn si aparecen); "## SUMMARY" o "## RESUMEN" según el idioma; "## SKILLS"; "## EXPERIENCE"; cada empleo como "### Cargo — Empresa" seguido de una línea con fechas y lugar, y viñetas "- "; "## EDUCATION"; otras secciones si existen. **negritas** solo en etiquetas de habilidades. Mantén el idioma original.\n\nCV PEGADO:\n'+t.slice(0,30000)+'\n\nResponde exactamente con:\n===CV===\n(el CV)\n===NOTAS===\n(en español: datos que parecen faltar, como fechas o empresas, para que la persona los complete; escribe "Nada" si está completo)';
}
function promptCarta(j,c,extra){
  return 'Escribe una carta de presentación de '+nombreP()+' para esta VACANTE.\n\n'+HONESTIDAD+'\n\n- Idioma de la vacante. 170 a 250 palabras, 3 o 4 párrafos, tono profesional y cercano. Evita frases gastadas como "I am writing to express my interest", "passionate", "dynamic", "fast-paced".\n- Primer párrafo: el puesto y la razón concreta por la que encaja. Párrafos centrales: 2 o 3 experiencias o logros reales del CV que responden a lo que pide la vacante. Cierre: trabaja en remoto desde República Dominicana, disponibilidad y una invitación breve a conversar.\n- Si el anuncio da instrucciones para la carta (una palabra clave, una pregunta, un formato), cúmplelas.\n- Firma con el nombre. Sin dirección ni fecha arriba.\n- Indicaciones extra de la persona: '+(extra||'ninguna')+'\n\n'+ctxPerfil()+'\n\nCV:\n'+c.contenido+'\n\nVACANTE:\n'+txtVacante(j)+'\n\nResponde solo con la carta.';
}
function promptRespuestas(j,c,q){
  return 'Redacta las respuestas de '+nombreP()+' a estas preguntas del formulario de aplicación.\n\n'+HONESTIDAD+'\n\n- Primera persona, en el idioma de las preguntas, concretas (2 a 5 frases salvo que pidan más).\n- Para preguntas de datos (expectativa salarial, disponibilidad, horario, años de experiencia, autorización de trabajo, ubicación): da la respuesta que corresponde según el perfil y agrega debajo una línea [Confirma: …] en español si algo depende de la persona. Expectativa salarial: usa el pago ideal del perfil (o un rango que termine en él), nunca por debajo del mínimo. Ubicación: República Dominicana, trabajo remoto.\n- Numera las respuestas igual que las preguntas.\n\n'+ctxPerfil()+'\n\nCV:\n'+c.contenido+'\n\nVACANTE:\n'+txtVacante(j)+'\n\nPREGUNTAS:\n'+q;
}
function cvPara(j){ const pk=S.paquetes[j.id]||{}; const c=(pk.cvAjustadoId&&cv(pk.cvAjustadoId)); return c?c.contenido:cvPrincipal(); }
function promptRec(t,j,c,ctx){
  const comun='\n\n'+ctxPerfil()+'\n\nCV:\n'+c.slice(0,9000)+'\n\nVACANTE:\n'+txtVacante(j)+'\n\nCONTEXTO QUE DA LA PERSONA:\n'+(ctx||'(ninguno)')+'\n\nHoy es '+hoy()+'. '+HORAS;
  const m={
    entrevista:'Prepara a '+nombreP()+' para la entrevista de este puesto. Incluye: 1) Resumen del puesto y lo que más le importa al empleador, solo con lo que dice la vacante (no inventes datos de la empresa). 2) Las 10 preguntas más probables, incluyendo "Tell me about yourself", por qué este puesto, experiencia con lo que piden, una situacional, sus brechas, pago y horario; para cada una una respuesta sugerida en el idioma de la entrevista (inglés si la vacante está en inglés), en primera persona, con el método STAR cuando aplique y solo con experiencia real del CV. 3) 5 preguntas inteligentes para hacerle al reclutador. 4) Lista breve para una entrevista remota (internet, audio, cámara, documentos a mano). Explicaciones en español.',
    reclutador:'Primero, en 1 a 3 líneas en español, revisa señales de estafa en el mensaje (pedir pagos, cursos o certificados pagados, contacto solo por WhatsApp o Telegram, correos de dominios gratuitos o raros, pedir cédula o datos bancarios antes de una oferta formal, contratar sin entrevista, pago muy por encima o por debajo de lo normal). Luego escribe un borrador de respuesta en el idioma del mensaje, breve y profesional, que pida lo que falte saber según las reglas (canal sin llamadas, pago, horario, país). Termina con una línea en español: qué hacer después.',
    estafa:'Evalúa en español si este mensaje u oferta parece una estafa. Da un veredicto claro (Probable estafa / Dudoso / Parece legítimo), las señales concretas que encuentras citando partes breves del mensaje, qué verificar (dominio del correo, sitio oficial de la empresa, LinkedIn del reclutador) y qué NO hacer (pagar, enviar cédula o datos bancarios antes de un contrato verificable).',
    seguimiento:'Escribe un correo de seguimiento breve (60 a 110 palabras) para esta postulación, en el idioma de la vacante, cordial y concreto, que recuerde el puesto y 1 punto fuerte real. Incluye una línea "Asunto:". Agrega al final una línea en español sobre cuándo enviarlo (normalmente 5 a 7 días hábiles después de postular).',
    agradecimiento:'Escribe una nota de agradecimiento después de la entrevista (80 a 130 palabras), en el idioma de la vacante, que mencione algo concreto de la conversación si el contexto lo da y refuerce el encaje con experiencia real. Incluye "Asunto:". Indica en español: enviarla en las primeras 24 horas.',
    negociacion:'Prepara un guion en español para hablar de pago, con las frases para decir en el idioma de la vacante. Objetivo: el pago ideal del perfil, sin bajar del mínimo. Incluye: cuánto es por hora, por mes (173.3 h) y por año (2080 h); 3 frases para dar su cifra con seguridad; cómo responder si ofrecen menos; qué preguntar (frecuencia y método de pago, si las horas están garantizadas, quién pone el equipo, contrato o freelance); y qué no aceptar nunca (pagar por equipo, cursos o certificados para empezar).'
  };
  return (m[t]||m.entrevista)+comun;
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(!f) return; if(el.dataset.act==='fondoModal'){ f(el,e); return; } if(el.tagName!=='A') e.preventDefault(); if(el.disabled) return; f(el,e); });
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.bind){ S.d[t.dataset.bind]=t.type==='checkbox'?t.checked:t.value; if(t.tagName==='SELECT') render(); } if(t.dataset.input==='q'){ S.q=t.value; render(); } });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.bind&&t.type==='checkbox'){ S.d[t.dataset.bind]=t.checked; } const a=t.dataset.change; if(a&&CHANGE[a]) CHANGE[a](t); if(S.renderLuego){ S.renderLuego=false; setTimeout(render,0); } });
document.addEventListener('pointerdown',()=>{ puntero=true; },true);
document.addEventListener('pointerup',()=>{ puntero=false; if(S.renderLuego){ setTimeout(()=>{ if(!puntero&&S.renderLuego){ S.renderLuego=false; render(); } },60); } },true);
document.addEventListener('focusout',()=>{ setTimeout(()=>{ const a=document.activeElement; if(S.renderLuego&&!puntero&&!(a&&a.tagName==='SELECT')){ S.renderLuego=false; render(); } },120); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal){ if(S.copiar){ cerrarCopiar(null); return; } S.modal=null; render(); } });
window.addEventListener('hashchange',()=>{ const t=(location.hash||'').slice(1); if(TABS.some(x=>x[0]===t)&&t!==S.tab){ S.tab=t; render(); } });
window.addEventListener('resize',()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(render,200); });

/* ---------- Arranque ---------- */
async function iniciar(){
  construir(); render();
  try{ const r=await fetch('data/vacantes.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); S.data=await r.json(); }
  catch(e){ S.dataError=String(e.message||e); }
  S.ready=true; construir(); render();
}
iniciar();
